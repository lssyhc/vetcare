<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(
                pageTitle='Register - VetCare',
                headerFragment=~{fragments/header :: header},
                footerFragment=~{fragments/footer :: footer},
                pageContent=~{:: #page-content},
                pageSpecificStyles=~{:: #page-styles},
                pageSpecificScripts=~{:: #page-scripts}
              )}"
>
  <th:block id="page-styles"> </th:block>

  <div id="page-content">
    <div class="register-container">
      <div class="register-wrapper">
        <main class="register-main">
          <div class="register-header">
            <h2 class="register-title">Daftar akun</h2>
            <p class="register-subtitle">
              Atau
              <a th:href="@{/auth/login}" class="register-login-link">
                masuk jika sudah punya akun
              </a>
            </p>
          </div>

          <div class="register-form-container">
            <div th:if="${error}" class="register-error" role="alert">
              <p th:text="${error}">Error message here</p>
            </div>

            <form
              th:action="@{/auth/register}"
              method="post"
              class="register-form"
            >
              <div class="register-field">
                <label class="register-label">Daftar Sebagai</label>
                <div class="register-role-grid">
                  <div>
                    <input
                      type="radio"
                      id="role-pemilik"
                      name="userType"
                      value="owner"
                      class="register-role-input"
                      checked
                    />
                    <label for="role-pemilik" class="register-role-label">
                      Pemilik Hewan
                    </label>
                  </div>
                  <div>
                    <input
                      type="radio"
                      id="role-vet"
                      name="userType"
                      value="veterinarian"
                      class="register-role-input"
                    />
                    <label for="role-vet" class="register-role-label">
                      Dokter Hewan
                    </label>
                  </div>
                </div>
              </div>

              <div class="register-field">
                <label for="nama" class="register-label">Nama Lengkap</label>
                <input
                  type="text"
                  id="nama"
                  name="name"
                  required
                  class="register-input"
                  placeholder="Masukkan nama lengkap"
                />
              </div>

              <div class="register-field">
                <label for="email" class="register-label">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  class="register-input"
                  placeholder="anda@email.com"
                />
              </div>

              <div
                id="spesialisasi-container"
                class="register-specialization-container"
              >
                <label for="spesialisasi" class="register-label"
                  >Spesialisasi</label
                >
                <input
                  type="text"
                  id="spesialisasi"
                  name="specialization"
                  class="register-input"
                  placeholder="Contoh: Bedah, Dermatologi, dll."
                />
              </div>

              <div class="register-field">
                <label for="password" class="register-label">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  class="register-input"
                  placeholder="Masukkan password"
                />
              </div>

              <div class="register-field">
                <button type="submit" class="register-button">
                  Daftar Sekarang
                </button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>
  </div>

  <th:block id="page-scripts">
    <script th:src="@{/js/toggleRole.js}"></script>
  </th:block>
</html>
