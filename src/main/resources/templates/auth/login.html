<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout(
                pageTitle='Login - VetCare',
                headerFragment=~{fragments/header :: header},
                footerFragment=~{fragments/footer :: footer},
                pageContent=~{:: #page-content},
                pageSpecificStyles=~{:: #page-styles},
                pageSpecificScripts=~{:: #page-scripts}
              )}"
>
  <th:block id="page-styles"> </th:block>

  <div id="page-content">
    <div class="login-container">
      <div class="login-wrapper">
        <main class="login-main">
          <div class="login-header">
            <h2 class="login-title">Login ke akun anda</h2>
            <p class="login-subtitle">
              Atau
              <a th:href="@{/auth/register}" class="login-register-link">
                buat akun baru jika belum punya
              </a>
            </p>
          </div>

          <div class="login-form-container">
            <div th:if="${error}" class="login-error" role="alert">
              <span th:text="${error}">Error message</span>
            </div>

            <div th:if="${message}" class="logout-success" role="alert">
              <span th:text="${message}">Success message</span>
            </div>

            <form th:action="@{/auth/login}" method="post" class="login-form">
              <div class="login-field">
                <label for="username" class="login-label">Email</label>
                <input
                  type="email"
                  id="username"
                  name="username"
                  required
                  autofocus
                  class="login-input"
                  placeholder="username@email.com"
                />
              </div>

              <div class="login-field">
                <label for="password" class="login-label">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  class="login-input"
                  placeholder="Password Anda"
                />
              </div>

              <div class="login-field">
                <button type="submit" class="login-button">Masuk</button>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>
  </div>

  <th:block id="page-scripts"> </th:block>
</html>
