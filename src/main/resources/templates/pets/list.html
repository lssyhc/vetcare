<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/layout :: head"></head>
  <body>
    <div th:replace="fragments/header :: header"></div>
    <div class="container mx-auto p-4">
      <h1 class="text-2xl font-bold mb-4">My Pets</h1>

      <!-- Error Messages -->
      <div
        th:if="${param.error}"
        class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded"
      >
        <div th:if="${param.error[0] == 'unauthorized'}">
          You are not authorized to perform this action.
        </div>
        <div th:if="${param.error[0] == 'delete_failed'}">
          Failed to delete pet. Please try again.
        </div>
      </div>

      <a
        href="/pets/add"
        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded mb-4 inline-block"
      >
        Add New Pet
      </a>

      <div th:if="${#lists.isEmpty(pets)}" class="mt-4 p-4 bg-gray-100 rounded">
        <p class="text-gray-600">
          You don't have any pets yet.
          <a href="/pets/add" class="text-blue-500">Add your first pet</a>
        </p>
      </div>

      <div th:unless="${#lists.isEmpty(pets)}">
        <table
          class="table-auto w-full mt-4 border-collapse border border-gray-300"
        >
          <thead class="bg-gray-50">
            <tr>
              <th class="border border-gray-300 px-4 py-2 text-left">Name</th>
              <th class="border border-gray-300 px-4 py-2 text-left">
                Species
              </th>
              <th class="border border-gray-300 px-4 py-2 text-left">
                Actions
              </th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="pet : ${pets}" class="hover:bg-gray-50">
              <td
                class="border border-gray-300 px-4 py-2"
                th:text="${pet.name}"
              ></td>
              <td
                class="border border-gray-300 px-4 py-2"
                th:text="${pet.species}"
              ></td>
              <td class="border border-gray-300 px-4 py-2">
                <a
                  th:href="@{'/pets/' + ${pet.id} + '/edit'}"
                  class="text-blue-500 hover:text-blue-700 mr-3"
                  >Edit</a
                >
                |
                <form
                  th:action="@{'/pets/' + ${pet.id} + '/delete'}"
                  method="post"
                  style="display: inline-block"
                  onsubmit="return confirm('Apakah anda yakin ingin menghapus pet ini?');"
                >
                  <button
                    type="submit"
                    class="text-red-500 hover:text-red-700 font-medium"
                  >
                    Delete
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div th:replace="fragments/footer :: footer"></div>
  </body>
</html>
