<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/dashboard-layout :: dashboardLayout(
                pageTitle='Edit Hewan Peliharaan - VetCare',
                sidebarFragment=~{fragments/sidebar-owner :: ownerSidebar},
                pageContent=~{:: #page-content},
                pageSpecificStyles=~{:: #page-styles},
                pageSpecificScripts=~{:: #page-scripts}
              )}"
>
  <th:block id="page-styles"> </th:block>

  <div id="page-content">
    <div class="edit-pet-dashboard">
      <div class="edit-pet-container">
        <div class="edit-pet-form-card">
          <div class="pet-section-header">
            <h2 class="pet-section-title">Edit Hewan Peliharaan</h2>
          </div>
          <div class="pet-content-section">
            <form
              th:action="@{'/pets/' + ${pet.id} + '/edit'}"
              method="post"
              class="edit-pet-form"
            >
              <div class="edit-pet-form-section">
                <div class="edit-pet-form-group">
                  <label for="name" class="edit-pet-form-label required"
                    >Nama Hewan Peliharaan</label
                  >
                  <input
                    type="text"
                    id="name"
                    name="name"
                    th:value="${pet.name}"
                    class="edit-pet-form-input"
                    placeholder="Masukkan nama hewan peliharaan"
                    required
                  />
                </div>

                <div class="edit-pet-form-group">
                  <label for="species" class="edit-pet-form-label required"
                    >Spesies</label
                  >
                  <input
                    type="text"
                    id="species"
                    name="species"
                    th:value="${pet.species}"
                    class="edit-pet-form-input"
                    placeholder="Masukkan spesies hewan peliharaan"
                    required
                  />
                </div>
              </div>

              <div class="edit-pet-form-actions">
                <button type="submit" class="edit-pet-btn-primary">
                  <svg
                    class="edit-pet-btn-icon"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                    ></path>
                  </svg>
                  Perbarui Hewan Peliharaan
                </button>
                <a th:href="@{/pets}" class="edit-pet-btn-secondary">
                  <svg
                    class="edit-pet-btn-icon"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    ></path>
                  </svg>
                  Batal
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <th:block id="page-scripts"> </th:block>
</html>
