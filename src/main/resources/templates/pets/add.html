<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/dashboard-layout :: dashboardLayout(
                pageTitle='Tambah Hewan Peliharaan Baru - VetCare',
                sidebarFragment=~{fragments/sidebar-owner :: ownerSidebar},
                pageContent=~{:: #page-content},
                pageSpecificStyles=~{:: #page-styles},
                pageSpecificScripts=~{:: #page-scripts}
              )}"
>
  <th:block id="page-styles"> </th:block>

  <div id="page-content">
    <div class="add-pet-dashboard">
      <div class="add-pet-container">
        <div class="add-pet-form-card">
          <div class="pet-section-header">
            <h2 class="pet-section-title">Tambah Hewan Peliharaan Baru</h2>
          </div>
          <div class="pet-content-section">
            <form
              action="/pets/add"
              method="post"
              class="add-pet-form"
              autocomplete="on"
            >
              <div class="add-pet-form-section">
                <div class="add-pet-form-group">
                  <label for="name" class="add-pet-form-label required"
                    >Nama Hewan Peliharaan</label
                  >
                  <input
                    type="text"
                    id="name"
                    name="name"
                    class="add-pet-form-input"
                    placeholder="Masukkan nama hewan peliharaan"
                    required
                  />
                </div>

                <div class="add-pet-form-group">
                  <label for="species" class="add-pet-form-label required"
                    >Spesies</label
                  >
                  <input
                    type="text"
                    id="species"
                    name="species"
                    class="add-pet-form-input"
                    placeholder="Masukkan spesies hewan peliharaan"
                    required
                  />
                </div>
              </div>

              <div class="add-pet-form-actions">
                <button type="submit" class="add-pet-btn-primary">
                  <svg
                    class="add-pet-btn-icon"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 6v6m0 0v6m0-6h6m-6 0H6"
                    ></path>
                  </svg>
                  Tambah Hewan Peliharaan
                </button>
                <a th:href="@{/pets}" class="add-pet-btn-secondary">
                  <svg
                    class="add-pet-btn-icon"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    ></path>
                  </svg>
                  Batal
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <th:block id="page-scripts"> </th:block>
</html>
