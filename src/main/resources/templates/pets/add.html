<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/layout :: head"></head>
  <body>
    <div th:replace="fragments/header :: header"></div>
    <div class="container mx-auto p-4">
      <h1 class="text-2xl font-bold mb-4">Add New Ped</h1>
      <form action="/pets/add" method="post" class="space-y-4">
        <div>
          <label for="name" class="block text-sm font-medium">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="border rounded w-full px-3 py-2"
            required
          />
        </div>
        <div>
          <label for="species" class="block text-sm font-medium">Species</label>
          <input
            type="text"
            id="species"
            name="species"
            class="border rounded w-full px-3 py-2"
            required
          />
        </div>
        <div>
          <button
            type="submit"
            class="bg-blue-500 text-white px-4 py-2 rounded"
          >
            Add Pet
          </button>
          <a href="/pets" class="ml-4 text-blue-500">Cancel</a>
        </div>
      </form>
    </div>
    <div th:replace="fragments/footer :: footer"></div>
  </body>
</html>
