<!DOCTYPE html>
<html
  lang="id"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="layout (
    pageTitle,
    pageContent,
    headerFragment,
    footerFragment,
    pageSpecificStyles,
    pageSpecificScripts
  )"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle ?: 'VetCare'}">VetCare</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <th:block th:replace="${pageSpecificStyles} ?: ~{}"></th:block>
  </head>
  <body class="layout-body">
    <header class="layout-header">
      <div
        th:replace="${headerFragment} ?: ~{fragments/header :: header}"
      ></div>
    </header>

    <main class="layout-main" th:replace="${pageContent}">
      <div class="layout-default-content">
        <p class="layout-default-message">
          Mohon sediakan konten untuk halaman ini.
        </p>
      </div>
    </main>

    <footer class="layout-footer">
      <div
        th:replace="${footerFragment} ?: ~{fragments/footer :: footer}"
      ></div>
    </footer>

    <script th:src="@{/js/script.js}" type="module"></script>
    <th:block th:replace="${pageSpecificScripts} ?: ~{}"></th:block>
  </body>
</html>
