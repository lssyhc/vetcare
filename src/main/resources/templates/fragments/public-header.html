<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <header th:fragment="publicHeader" class="fixed w-full top-0 z-50">
    <nav class="bg-white shadow-lg rounded-b-2xl">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
          <div class="flex-shrink-0">
            <a
              th:href="@{/}"
              class="group text-2xl sm:text-3xl text-primary hover:text-primary-dark transition-colors duration-300 ease-in-out inline-flex items-center focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 rounded-sm px-1 py-1"
            >
              <span class="font-poppins">VetCare</span>
              <div class="relative h-6 w-6 sm:h-8 sm:w-8 ml-2 mb-1">
                <img
                  th:src="@{/images/paw.png}"
                  alt="VetCare Paw"
                  class="absolute top-0 left-0 h-full w-full transition-opacity duration-300 ease-in-out opacity-100 group-hover:opacity-0"
                />
                <img
                  th:src="@{/images/paw-dark.png}"
                  alt="VetCare Paw Hover"
                  class="absolute top-0 left-0 h-full w-full transition-opacity duration-300 ease-in-out opacity-0 group-hover:opacity-100"
                />
              </div>
            </a>
          </div>

          <div
            class="hidden md:flex md:space-x-2 lg:space-x-3 items-center"
            th:with="currentUri=${requestUri},
                        homeUrl=@{/},
                        loginUrl=@{/auth/login},
                        registerUrl=@{/auth/register}"
          >
            <a
              th:href="@{/}"
              class="nav-item"
              th:classappend="${currentUri == homeUrl ? 'active' : ''}"
              th:aria-current="${currentUri == homeUrl ? 'page' : false}"
              >Beranda</a
            >
            <a
              th:href="@{/auth/login}"
              class="nav-item"
              th:classappend="${currentUri == loginUrl ? 'active' : ''}"
              th:aria-current="${currentUri == loginUrl ? 'page' : false}"
              >Login</a
            >
            <div class="py-6 px-3">
              <a
                th:href="@{/auth/register}"
                class="register-btn"
                th:classappend="${currentUri == registerUrl ? 'active' : ''}"
                th:aria-current="${currentUri == registerUrl ? 'page' : false}"
              >
                Registrasi
              </a>
            </div>
          </div>

          <div class="md:hidden flex items-center space-x-2">
            <button
              id="mobile-menu-button"
              type="button"
              class="inline-flex items-center justify-center p-2 rounded-lg text-gray-500 hover:text-primary hover:bg-gray-100"
              aria-controls="mobile-menu"
              aria-expanded="false"
            >
              <span class="sr-only">Buka menu utama</span>
              <svg
                class="block h-6 w-6"
                id="icon-hamburger"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
              <svg
                class="hidden h-6 w-6"
                id="icon-close"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div
        id="mobile-menu-backdrop"
        class="md:hidden fixed inset-x-0 bottom-0 bg-black bg-opacity-50 transition-opacity duration-300 ease-in-out opacity-0 invisible z-40"
        style="pointer-events: none; top: 80px"
      ></div>

      <div
        id="mobile-menu"
        class="md:hidden fixed inset-x-0 top-20 transition-all duration-300 ease-in-out transform opacity-0 invisible z-50"
        th:with="currentUri=${requestUri},
                    homeUrl=@{/},
                    authLoginUrl=@{/auth/login},
                    authRegisterUrl=@{/auth/register}"
      >
        <div
          class="px-2 pt-4 pb-3 space-y-1 sm:px-3 -mt-4 bg-white rounded-b-2xl shadow-xl"
        >
          <a
            th:href="@{/}"
            class="nav-item mobile border-y border-gray-200"
            th:classappend="${currentUri == homeUrl ? 'active' : ''}"
            th:aria-current="${currentUri == homeUrl ? 'page' : false}"
            >Beranda</a
          >
          <a
            th:href="@{/auth/login}"
            class="nav-item mobile border-b border-gray-200"
            th:classappend="${currentUri == authLoginUrl ? 'active' : ''}"
            th:aria-current="${currentUri == authLoginUrl ? 'page' : false}"
            >Login</a
          >
          <a
            th:href="@{/auth/register}"
            class="nav-item mobile"
            th:classappend="${currentUri == authRegisterUrl ? 'text-primary font-semibold relative' : ''}"
            th:aria-current="${currentUri == authRegisterUrl ? 'page' : false}"
          >
            Registrasi
          </a>
        </div>
      </div>
    </nav>
  </header>
</html>
