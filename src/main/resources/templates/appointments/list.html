<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/dashboard-layout :: dashboardLayout(
                pageTitle='Janji Temu Saya - VetCare',
                sidebarFragment=${isOwner} ? ~{fragments/sidebar-owner :: ownerSidebar} : ~{fragments/sidebar-vet :: vetSidebar},
                pageContent=~{:: #content},
                pageSpecificStyles=~{:: #page-styles},
                pageSpecificScripts=~{:: #page-scripts}
              )}"
>
  <th:block id="page-styles"> </th:block>

  <div id="content">
    <div class="appointment-dashboard">
      <div class="appointment-container">
        <div class="appointment-header-card">
          <div class="appointment-header">
            <h1 class="appointment-title">Janji Temu Saya</h1>
            <a
              th:if="${isOwner}"
              href="/appointments/book"
              class="appointment-add-button"
            >
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 6v6m0 0v6m0-6h6m-6 0H6"
                ></path>
              </svg>
              Buat Janji Temu
            </a>
          </div>
        </div>

        <div
          th:if="${successMessage}"
          class="appointment-alert appointment-alert-success"
          role="alert"
        >
          <span th:text="${successMessage}"></span>
        </div>

        <div
          th:if="${errorMessage}"
          class="appointment-alert appointment-alert-error"
          role="alert"
        >
          <span th:text="${errorMessage}"></span>
        </div>

        <div class="appointment-content-card">
          <div class="appointment-section-header">
            <h2 class="appointment-section-title">Daftar Janji Temu</h2>
          </div>

          <div class="appointment-content-section">
            <div
              class="appointment-empty-state"
              th:if="${appointments == null || #lists.isEmpty(appointments)}"
            >
              <div class="appointment-empty-message">
                <p>Anda belum memiliki janji temu.</p>
              </div>
              <div class="appointment-empty-subtitle" th:if="${isOwner}">
                <p>
                  Klik "Buat Janji Temu" untuk menjadwalkan kunjungan pertama
                  Anda.
                </p>
              </div>
            </div>

            <div
              th:if="${appointments != null && not #lists.isEmpty(appointments)}"
            >
              <div class="appointment-table-wrapper">
                <table class="appointment-table">
                  <thead>
                    <tr>
                      <th class="appointment-col-datetime">Tanggal & Waktu</th>
                      <th th:if="${isVeterinarian}" class="appointment-col-pet">
                        Hewan & Pemilik
                      </th>
                      <th th:if="${isOwner}" class="appointment-col-pet">
                        Hewan Peliharaan
                      </th>
                      <th th:if="${isOwner}" class="appointment-col-vet">
                        Veterinarian
                      </th>
                      <th class="appointment-col-duration">Durasi</th>
                      <th class="appointment-col-status">Status</th>
                      <th class="appointment-col-actions">Tindakan</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="appointment : ${appointments}">
                      <td
                        class="appointment-datetime-text"
                        th:text="${#temporals.format(appointment.appointmentTime, 'dd MMMM yyyy, HH:mm', new java.util.Locale('id', 'ID'))}"
                      ></td>

                      <td
                        th:if="${isVeterinarian}"
                        class="appointment-pet-info"
                        th:text="${appointment.pet.name} + ' (' + ${appointment.owner.name} + ')'"
                      ></td>

                      <td
                        th:if="${isOwner}"
                        class="appointment-pet-info"
                        th:text="${appointment.pet.name} + ' (' + ${appointment.pet.species} + ')'"
                      ></td>

                      <td
                        th:if="${isOwner}"
                        class="appointment-vet-info"
                        th:text="${appointment.veterinarian.name} + ' (' + ${appointment.veterinarian.specialization} + ')'"
                      ></td>

                      <td
                        class="appointment-duration-text"
                        th:text="${appointment.durationMinutes} + ' menit'"
                      ></td>

                      <td>
                        <span
                          class="appointment-status-badge"
                          th:classappend="${'appointment-status-' + appointment.status.toString().toLowerCase()}"
                          th:text="${appointment.status.getDisplayName()}"
                        ></span>
                      </td>

                      <td>
                        <a
                          th:href="@{/appointments/{id}(id=${appointment.id})}"
                          class="appointment-action-link"
                        >
                          <svg
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                          >
                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                            ></path>
                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                            ></path>
                          </svg>
                          Lihat Detail
                        </a>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <th:block id="page-scripts"> </th:block>
</html>
