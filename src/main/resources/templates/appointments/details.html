<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/dashboard-layout :: dashboardLayout(
                pageTitle='Detail Janji Temu - VetCare',
                sidebarFragment=${isOwner} ? ~{fragments/sidebar-owner :: ownerSidebar} : ~{fragments/sidebar-vet :: vetSidebar},
                pageContent=~{:: #content},
                pageSpecificStyles=~{:: #page-styles},
                pageSpecificScripts=~{:: #page-scripts}
              )}"
>
  <th:block id="page-styles"> </th:block>

  <div id="content">
    <div class="appointment-details-dashboard">
      <div class="appointment-details-container">
        <a href="/appointments" class="appointment-details-back-link"
          >← Kembali ke Janji Temu</a
        >

        <div
          th:if="${successMessage}"
          class="appointment-details-alert appointment-details-alert-success"
          role="alert"
        >
          <span th:text="${successMessage}"></span>
        </div>

        <div
          th:if="${errorMessage}"
          class="appointment-details-alert appointment-details-alert-error"
          role="alert"
        >
          <span th:text="${errorMessage}"></span>
        </div>

        <div class="appointment-details-card">
          <div class="appointment-details-header">
            <div class="appointment-details-title">Detail Janji Temu</div>
            <span
              class="appointment-details-status-badge"
              th:classappend="${'appointment-details-status-' + appointment.status.toString().toLowerCase()}"
              th:text="${appointment.status.getDisplayName()}"
            ></span>
          </div>

          <div class="appointment-details-content">
            <div class="appointment-details-grid">
              <div class="appointment-details-item">
                <div class="appointment-details-label">Tanggal & Waktu</div>
                <div
                  class="appointment-details-value"
                  th:text="${#temporals.format(appointment.appointmentTime, 'dd MMMM yyyy, HH:mm', new java.util.Locale('id', 'ID'))}"
                ></div>
              </div>

              <div class="appointment-details-item">
                <div class="appointment-details-label">Durasi</div>
                <div
                  class="appointment-details-value"
                  th:text="${appointment.durationMinutes} + ' menit'"
                ></div>
              </div>

              <div class="appointment-details-item">
                <div class="appointment-details-label">Waktu Selesai</div>
                <div
                  class="appointment-details-value"
                  th:text="${#temporals.format(appointment.endTime, 'HH:mm', new java.util.Locale('id', 'ID'))}"
                ></div>
              </div>

              <div class="appointment-details-item">
                <div class="appointment-details-label">Hewan Peliharaan</div>
                <div
                  class="appointment-details-value"
                  th:text="${appointment.pet.name} + ' (' + ${appointment.pet.species} + ')'"
                ></div>
              </div>

              <div class="appointment-details-item">
                <div class="appointment-details-label">Veterinarian</div>
                <div
                  class="appointment-details-value"
                  th:text="${appointment.veterinarian.name} + ' (' + ${appointment.veterinarian.specialization} + ')'"
                ></div>
              </div>

              <div class="appointment-details-item">
                <div class="appointment-details-label">Pemilik</div>
                <div
                  class="appointment-details-value"
                  th:text="${appointment.owner.name}"
                ></div>
              </div>
            </div>

            <div class="appointment-details-notes-section">
              <div class="appointment-details-notes-title">Catatan</div>
              <div
                class="appointment-details-notes-content"
                th:if="${appointment.notes != null && !appointment.notes.isEmpty()}"
                th:text="${appointment.notes}"
              ></div>
              <div
                class="appointment-details-notes-content appointment-details-empty-notes"
                th:if="${appointment.notes == null || appointment.notes.isEmpty()}"
              >
                Belum ada catatan.
              </div>
            </div>
          </div>
        </div>

        <div
          class="appointment-details-card"
          th:if="${isVeterinarian && appointment.status.name() == 'SCHEDULED'}"
        >
          <div class="appointment-details-header">
            <div class="appointment-details-title">
              Perbarui Status Janji Temu
            </div>
          </div>
          <div class="appointment-details-content">
            <form
              th:action="@{/appointments/{id}/status(id=${appointment.id})}"
              method="post"
            >
              <div class="appointment-details-form-group">
                <label for="status" class="appointment-details-form-label"
                  >Status Baru</label
                >
                <select
                  id="status"
                  name="status"
                  class="appointment-details-form-select"
                >
                  <option value="COMPLETED">Selesai</option>
                  <option value="CANCELLED">Dibatalkan</option>
                </select>
              </div>

              <div class="appointment-details-form-actions">
                <button type="submit" class="appointment-details-btn-primary">
                  Perbarui Status
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="appointment-details-card" th:if="${isVeterinarian}">
          <div class="appointment-details-header">
            <div class="appointment-details-title">Tambah/Perbarui Catatan</div>
          </div>
          <div class="appointment-details-content">
            <form
              th:action="@{/appointments/{id}/notes(id=${appointment.id})}"
              method="post"
            >
              <div class="appointment-details-form-group">
                <label for="notes" class="appointment-details-form-label"
                  >Catatan</label
                >
                <textarea
                  id="notes"
                  name="notes"
                  class="appointment-details-form-textarea"
                  th:text="${appointment.notes}"
                ></textarea>
              </div>

              <div class="appointment-details-form-actions">
                <button type="submit" class="appointment-details-btn-primary">
                  Simpan Catatan
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <th:block id="page-scripts"></th:block>
</html>
